name: page_view_events

source:
  type: csv
  path: /opt/data/page_view_events.csv

target:
  database: streamify_databases
  table: raw_page_view_events
  engine: MergeTree
  order_by:
    - sessionId
  partition_by: null

storage:
  provider: minio
  bucket: ecom
  layer: raw
  folder: page_view_events
  format: csv

column_types:
  ts: DateTime
  sessionId: Float64
  page: String
  auth: String
  method: String
  status: UInt64
  level: String
  itemInSession: UInt64
  city: String
  zip: Float64
  state: String 
  userAgent: String
  lon: Float64
  lat: Float64
  userId: UInt64
  lastName: String
  firstName: String
  gender: String
  registration: Float64
  artist: String
  song: String
  duration: Float64
  year: UInt64
  month: UInt64
  hour: UInt64
  day: UInt64


nullable:
  zip: true
  userId: true
  lastName: true
  firstName: true
  gender: true
  registration: true
  artist: true
  song: true
  duration: true

primary_key:
  - sessionId